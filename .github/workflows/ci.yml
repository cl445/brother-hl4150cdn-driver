name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: lint + format + typecheck + deps
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dev extras
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run nox -s lint
      - name: Ruff format check
        run: uv run nox -s format_check
      - name: Pyrefly typecheck
        run: uv run nox -s typecheck
      - name: Dependency check
        run: uv run nox -s deps

  tests:
    # Both variants run the byte-identity suite: "cython" covers the native
    # modules, "pure-python" the fallbacks used when no compiler is available.
    name: pytest (${{ matrix.variant }}, with Brother blobs)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        variant: [cython, pure-python]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install test extras
        run: uv sync --extra test
      - name: Pull Brother blobs (verified MD5; not redistributed)
        run: ./scripts/extract_blobs.sh
      - name: Build Cython modules
        if: matrix.variant == 'cython'
        run: uv run --with cython,setuptools python setup_cython.py build_ext --inplace
      - name: Check that the native modules load
        # The Cython comparison tests skip when a module is missing; fail
        # here instead so a broken build cannot pass silently.
        if: matrix.variant == 'cython'
        run: uv run python -c "import sys; sys.path.insert(0, 'src'); import _rle_fast, _color_fast, _dither_fast, _band_fast"
      - name: Run pytest
        run: uv run pytest tests/
