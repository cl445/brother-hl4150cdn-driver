name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: lint + format + typecheck + deps
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dev extras
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run nox -s lint
      - name: Ruff format check
        run: uv run nox -s format_check
      - name: Pyrefly typecheck
        run: uv run nox -s typecheck
      - name: Dependency check
        run: uv run nox -s deps

  rust-checks:
    name: cargo fmt + clippy + test
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: Rustfmt
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --no-default-features

  tests:
    # Every variant runs the byte-identity suite: "cython" covers the native
    # modules, "rust" the Rust kernels (with Cython for those not ported yet),
    # "pure-python" the fallbacks used when no compiler is available.
    # Python: the oldest version pyproject.toml allows and the newest.
    name: pytest (${{ matrix.variant }}, Python ${{ matrix.python }}, with Brother blobs)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        variant: [cython, rust, pure-python]
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install test extras
        run: uv sync --extra test
      - name: Pull Brother blobs (verified SHA-256; not redistributed)
        run: ./scripts/extract_blobs.sh
      - name: Build Cython modules
        if: matrix.variant != 'pure-python'
        run: uv run --with cython==3.3.0,setuptools==84.2.1 python setup_cython.py build_ext --inplace
      - name: Build Rust kernels
        if: matrix.variant == 'rust'
        run: ./scripts/build_rust.sh
      - name: Check that the native modules load
        # The native comparison tests skip when a module is missing; fail
        # here instead so a broken build cannot pass silently.
        if: matrix.variant != 'pure-python'
        run: uv run python -c "import sys; sys.path.insert(0, 'src'); from brother_xl2hb import _native; sys.exit(_native.summary() if _native.missing() else 0)"
      - name: Check that the Rust kernels are in use
        if: matrix.variant == 'rust'
        run: uv run python -c "import sys; sys.path.insert(0, 'src'); from brother_xl2hb import _native; sys.exit(0 if all(_native.backend(n) == 'rust' for n in ('_dither_fast', '_rle_fast')) else _native.summary())"
      - name: Run pytest
        run: uv run pytest tests/
